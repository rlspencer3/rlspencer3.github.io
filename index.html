<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3e7d3">
  <title>Games</title>
  <link rel="icon" href="hearthwood/icons/icon.svg" type="image/svg+xml">
  <style>
    :root { font-family: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #3b2f27; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #fff8ea, #f0dcb8); }
    a.card { display: flex; gap: 18px; align-items: center; padding: 18px 22px; border-radius: 22px; background: #fbf7ef; color: inherit; text-decoration: none;
      box-shadow: 0 8px 24px rgba(60, 40, 20, 0.18); max-width: 420px; margin: 16px; transition: transform 0.15s ease; }
    a.card:hover, a.card:focus-visible { transform: translateY(-2px); }
    a.card img { width: 84px; height: 84px; border-radius: 20px; flex: none; }
    h1 { margin: 0 0 4px; font-size: 24px; color: #5b3f2a; }
    p { margin: 0; color: #6d5b4c; line-height: 1.4; }
  </style>
</head>
<body>
  <a class="card" href="hearthwood/">
    <img src="hearthwood/icons/icon-192.png" alt="">
    <div>
      <h1>Hearthwood</h1>
      <p>A cozy house builder. Raise cabins, A-frames, cottages and farmhouses one wall, window and roof panel at a time.</p>
    </div>
  </a>
</body>
</html>
